<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Copiloto de Atendimento</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Copiloto de Atendimento</h1>
      <span id="thread-id" class="thread-id"></span>
    </header>

    <div id="banner-versao" class="banner banner-erro" hidden></div>
    <div id="banner-seletores" class="banner banner-aviso" hidden>
      Não consegui ler esta conversa — os seletores do HubSpot ainda não foram calibrados. Avise o
      admin.
    </div>
    <div id="banner-inativo" class="banner banner-neutro">
      Copiloto desativado nesta conversa. Clique em "Ativar copiloto" no canto da tela do HubSpot
      para começar.
    </div>

    <section>
      <h2 class="section-title">Conversa extraída</h2>
      <div id="conversa" class="conversa"></div>
    </section>

    <section>
      <h2 class="section-title">Perguntar ao copiloto</h2>
      <div id="ask-historico" class="ask-historico"></div>
      <form id="ask-form" class="ask-form">
        <textarea
          id="ask-input"
          rows="2"
          placeholder="Ex.: tem desconto para convênio Clinicorp?"
        ></textarea>
        <button id="ask-enviar" type="submit">Perguntar</button>
      </form>
    </section>

    <script type="module" src="main.ts"></script>
  </body>
</html>
